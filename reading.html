<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线阅读 - NLB eReads</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: { extend: { colors: { primary: '#0f4c81' }, fontFamily: { sans: ['Inter','sans-serif'], serif: ['Noto Serif SC','serif'] } } }
}
</script>
<style>
  body { font-family:'Inter',sans-serif; }
  .reading-content { font-family:'Noto Serif SC',serif; line-height:1.9; }
  .toolbar-shadow { box-shadow:0 2px 20px rgba(0,0,0,0.1); }
  .bottom-bar-shadow { box-shadow:0 -2px 20px rgba(0,0,0,0.08); }
  .panel-slide { transition:transform 0.3s ease; }
  .highlight-yellow { background:rgba(255,235,59,0.4); border-radius:2px; }
  .highlight-blue { background:rgba(33,150,243,0.2); border-radius:2px; }
  .progress-bar { background:linear-gradient(90deg,#0f4c81,#1a6bb5); }
  .theme-sepia { background:#f5f0e8; color:#5c4a32; }
  .theme-night { background:#1a1a2e; color:#c8c8d4; }
  .theme-white { background:#ffffff; color:#1f2937; }
</style>
<script src="i18n.js"></script>
<script src="nav.js"></script>
<script src="api-config.js"></script>
<script src="api-services.js"></script>
<style>
  #reader-iframe { width:100%; height:100%; border:none; }
  #reader-loading, #reader-error { position:absolute; inset:0; flex-direction:column; align-items:center; justify-content:center; }
</style>
</head>
<body class="bg-gray-100 h-screen overflow-hidden flex flex-col">

<!-- Top Toolbar -->
<div class="bg-white toolbar-shadow sticky top-0 z-50 px-4 py-2.5 flex items-center gap-3">
  <button class="flex items-center gap-2 text-gray-600 hover:text-primary transition text-sm" data-nav="book-detail">
    <i class="fas fa-arrow-left"></i>
    <span class="hidden sm:block">退出阅读</span>
  </button>
  <div class="flex-1 text-center">
    <p class="text-sm font-semibold text-gray-800 truncate" id="reading-title">新加坡史</p>
    <p class="text-xs text-gray-400" id="reading-chapter">第三章：英国殖民统治</p>
  </div>
  <div class="flex items-center gap-2">
    <button class="p-2 text-gray-500 hover:text-primary transition" title="目录">
      <i class="fas fa-list-ul"></i>
    </button>
    <button class="p-2 text-gray-500 hover:text-primary transition" title="书签">
      <i class="fas fa-bookmark"></i>
    </button>
    <button class="p-2 text-gray-500 hover:text-primary transition" title="设置" onclick="toggleSettings()">
      <i class="fas fa-cog"></i>
    </button>
  </div>
</div>

<!-- Reading Progress Bar -->
<div class="h-1 bg-gray-200 sticky top-12 z-40">
  <div class="progress-bar h-full" style="width:65%"></div>
</div>

<div class="flex flex-1 relative min-h-0">

  <!-- TOC Sidebar (hidden by default) -->
  <div id="toc-panel" class="hidden fixed left-0 top-0 h-full w-64 bg-white shadow-xl z-50 overflow-y-auto">
    <div class="p-4 border-b border-gray-100 flex items-center justify-between">
      <h3 class="font-semibold text-gray-800">目录</h3>
      <button onclick="document.getElementById('toc-panel').classList.add('hidden')" class="text-gray-400 hover:text-gray-600">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="p-3 space-y-1" id="toc-list">
      <div class="px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 rounded-lg cursor-pointer">第一章：史前新加坡</div>
      <div class="px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 rounded-lg cursor-pointer">第二章：淡马锡时代</div>
      <div class="px-3 py-2 text-sm font-medium text-primary bg-blue-50 rounded-lg cursor-pointer">第三章：英国殖民统治</div>
      <div class="px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 rounded-lg cursor-pointer">第四章：日据时期</div>
      <div class="px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 rounded-lg cursor-pointer">第五章：独立建国</div>
    </div>
  </div>

  <!-- Settings Panel -->
  <div id="settings-panel" class="hidden fixed right-0 top-12 w-72 bg-white shadow-xl z-50 rounded-l-2xl overflow-hidden">
    <div class="p-4 border-b border-gray-100">
      <h3 class="font-semibold text-gray-800 text-sm">阅读设置</h3>
    </div>
    <div class="p-4 space-y-5">
      <!-- Font Size -->
      <div>
        <p class="text-xs font-medium text-gray-500 mb-2">字体大小</p>
        <div class="flex items-center gap-3">
          <button class="w-8 h-8 border border-gray-200 rounded-lg flex items-center justify-center text-gray-600 hover:bg-gray-50">
            <i class="fas fa-minus text-xs"></i>
          </button>
          <div class="flex-1 bg-gray-100 rounded-full h-2">
            <div class="bg-primary h-2 rounded-full" style="width:50%"></div>
          </div>
          <button class="w-8 h-8 border border-gray-200 rounded-lg flex items-center justify-center text-gray-600 hover:bg-gray-50">
            <i class="fas fa-plus text-xs"></i>
          </button>
          <span class="text-sm text-gray-600 w-8 text-center">18</span>
        </div>
      </div>
      <!-- Line Height -->
      <div>
        <p class="text-xs font-medium text-gray-500 mb-2">行间距</p>
        <div class="flex gap-2">
          <button class="flex-1 py-1.5 border border-gray-200 rounded-lg text-xs text-gray-600 hover:bg-gray-50">紧凑</button>
          <button class="flex-1 py-1.5 bg-primary text-white rounded-lg text-xs">标准</button>
          <button class="flex-1 py-1.5 border border-gray-200 rounded-lg text-xs text-gray-600 hover:bg-gray-50">宽松</button>
        </div>
      </div>
      <!-- Theme -->
      <div>
        <p class="text-xs font-medium text-gray-500 mb-2">主题</p>
        <div class="flex gap-2">
          <button onclick="setTheme('white')" class="flex-1 py-2 bg-white border-2 border-primary rounded-lg text-xs text-gray-700">白天</button>
          <button onclick="setTheme('sepia')" class="flex-1 py-2 rounded-lg text-xs" style="background:#f5f0e8;color:#5c4a32;border:2px solid transparent">护眼</button>
          <button onclick="setTheme('night')" class="flex-1 py-2 rounded-lg text-xs" style="background:#1a1a2e;color:#c8c8d4;border:2px solid transparent">夜间</button>
        </div>
      </div>
      <!-- Font -->
      <div>
        <p class="text-xs font-medium text-gray-500 mb-2">字体</p>
        <div class="flex gap-2">
          <button class="flex-1 py-1.5 bg-primary text-white rounded-lg text-xs">宋体</button>
          <button class="flex-1 py-1.5 border border-gray-200 rounded-lg text-xs text-gray-600 hover:bg-gray-50">黑体</button>
          <button class="flex-1 py-1.5 border border-gray-200 rounded-lg text-xs text-gray-600 hover:bg-gray-50">楷体</button>
        </div>
      </div>
      <!-- Special -->
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs text-gray-600">语音朗读</span>
          <button class="w-10 h-5 bg-gray-200 rounded-full relative transition">
            <span class="absolute left-0.5 top-0.5 w-4 h-4 bg-white rounded-full shadow transition"></span>
          </button>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-xs text-gray-600">拼音标注</span>
          <button class="w-10 h-5 bg-gray-200 rounded-full relative transition">
            <span class="absolute left-0.5 top-0.5 w-4 h-4 bg-white rounded-full shadow transition"></span>
          </button>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-xs text-gray-600">大字模式</span>
          <button class="w-10 h-5 bg-primary rounded-full relative transition">
            <span class="absolute right-0.5 top-0.5 w-4 h-4 bg-white rounded-full shadow transition"></span>
          </button>
        </div>
      </div>
      <!-- Download -->
      <div>
        <p class="text-xs font-medium text-gray-500 mb-2">下载书籍</p>
        <div class="flex gap-2">
          <button id="btn-dl-epub" class="flex-1 py-1.5 border border-gray-200 rounded-lg text-xs text-gray-600 hover:bg-gray-50 transition">EPUB</button>
          <button id="btn-dl-pdf" class="flex-1 py-1.5 border border-gray-200 rounded-lg text-xs text-gray-600 hover:bg-gray-50 transition">PDF</button>
          <button id="btn-dl-mobi" class="flex-1 py-1.5 border border-gray-200 rounded-lg text-xs text-gray-600 hover:bg-gray-50 transition">MOBI</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Reading Area -->
  <main id="reading-area" class="flex-1 theme-white overflow-hidden relative">
    <!-- Loading State -->
    <div id="reader-loading" class="bg-white pt-40">
      <div class="text-center">
        <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <p class="text-gray-500 text-sm">正在加载书籍...</p>
      </div>
    </div>
    <!-- Error State -->
    <div id="reader-error" class="bg-white hidden pt-40">
      <div class="text-center px-6">
        <i class="fas fa-exclamation-circle text-4xl text-red-400 mb-4"></i>
        <p class="text-gray-700 font-medium mb-2" id="reader-error-msg">加载失败</p>
        <button id="reader-retry" class="mt-3 px-4 py-2 bg-primary text-white rounded-lg text-sm">重试</button>
      </div>
    </div>
    <!-- Reader Iframe -->
    <iframe id="reader-iframe" class="hidden" allowfullscreen></iframe>
  </main>
</div>

<!-- Bottom Bar -->
<div class="bg-white bottom-bar-shadow sticky bottom-0 z-40 px-4 py-3">
  <div class="max-w-2xl mx-auto flex items-center gap-4">
    <!-- Page Navigation -->
    <button class="w-9 h-9 flex items-center justify-center border border-gray-200 rounded-xl text-gray-500 hover:bg-gray-50 transition flex-shrink-0">
      <i class="fas fa-chevron-left text-xs"></i>
    </button>

    <!-- Progress -->
    <div class="flex-1">
      <div class="flex items-center justify-between text-xs text-gray-400 mb-1">
        <span id="reading-page-cur">第 134 页</span>
        <span class="font-medium text-primary" id="reading-pct">65%</span>
        <span id="reading-page-total">共 456 页</span>
      </div>
      <div class="w-full bg-gray-100 rounded-full h-1.5 cursor-pointer">
        <div class="progress-bar h-1.5 rounded-full" style="width:65%"></div>
      </div>
    </div>

    <button class="w-9 h-9 flex items-center justify-center border border-gray-200 rounded-xl text-gray-500 hover:bg-gray-50 transition flex-shrink-0">
      <i class="fas fa-chevron-right text-xs"></i>
    </button>

    <!-- Actions -->
    <div class="flex items-center gap-1 flex-shrink-0">
      <button class="w-9 h-9 flex items-center justify-center text-gray-500 hover:text-primary transition" title="添加书签">
        <i class="fas fa-bookmark text-sm"></i>
      </button>
      <button class="w-9 h-9 flex items-center justify-center text-gray-500 hover:text-primary transition" title="笔记">
        <i class="fas fa-pen text-sm"></i>
      </button>
      <button class="px-3 py-1.5 bg-primary text-white rounded-lg text-xs font-medium hover:bg-primary-dark transition">
        续借
      </button>
    </div>
  </div>

  <!-- Borrow Status -->
  <div class="max-w-2xl mx-auto mt-2 flex items-center justify-between text-xs text-gray-400">
    <span><i class="fas fa-clock mr-1"></i>借阅剩余 <span class="text-orange-500 font-medium">5天</span></span>
    <span>跨设备进度已同步 <i class="fas fa-check-circle text-green-500 ml-1"></i></span>
  </div>
</div>

<script>
function toggleSettings() {
  const panel = document.getElementById('settings-panel');
  panel.classList.toggle('hidden');
}
function setTheme(theme) {
  const area = document.getElementById('reading-area');
  area.className = 'flex-1 theme-' + theme + ' overflow-hidden relative';
}
</script>
<script src="reading-integration.js"></script>
</body>
</html>
